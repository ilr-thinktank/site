# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.235.1/schema/sveltia-cms.json
backend:
  name: github
  repo: ilr-thinktank/site
  branch: main
  base_url: https://ilr-cms-auth.ilr-site.workers.dev
  auth_methods: [oauth, token]
  auth_scope: public_repo
  # Keep token login as a fallback until browser OAuth sign-in is confirmed.
site_url: https://raison-institut.fr
display_url: https://raison-institut.fr
locale: fr
media_folder: public/media
public_folder: /media
collections:
  - name: articles
    label: Productions
    label_singular: Production
    folder: content/articles
    create: true
    slug: '{{slug}}'
    preview_path: '{{slug}}/'
    summary: '{{title}} — {{author}}'
    fields:
      - {label: Titre, name: title, widget: string}
      - {label: "Adresse URL (minuscules et tirets, ne pas modifier après publication)", name: slug, widget: string, pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Minuscules, chiffres et tirets uniquement']}
      - {label: Date de publication, name: date, widget: datetime, type: date, format: YYYY-MM-DD}
      - {label: Auteur, name: author, widget: string}
      - {label: Fonction de l’auteur, name: authorRole, widget: string, required: false}
      - {label: Catégorie, name: rubrique, widget: select, options: [Audiences, Bancs d’essai, Raisons d’État, Angles morts, Doléances]}
      # Format (Vidéo, Tribune, Essai court, Podcast, Analyse de fond): hidden for now, kept in content.
      - {label: Format, name: category, widget: hidden, default: Essai court}
      # Themes link productions across categories and authors (filters and infographic on /productions/). Add options here as needed.
      - {label: Thèmes, name: themes, widget: select, multiple: true, required: false, options: [Souveraineté, Démocratie, Institutions, Élections, Partis politiques, Europe, Relations internationales, Économie, Territoires, Société]}
      - {label: Résumé, name: description, widget: text, required: false}
      - {label: Image de couverture, name: image, widget: image, required: false}
      - {label: Document PDF, name: pdf, widget: file, required: false}
      - {label: "Vidéo ou podcast (lien YouTube ou Vimeo, ou fichier audio/vidéo)", name: media, widget: file, required: false}
      - label: "Transcription (relue, avec minutage)"
        name: transcript
        widget: list
        required: false
        summary: '{{fields.time}} — {{fields.heading}}'
        fields:
          - {label: "Minutage (mm:ss ou h:mm:ss)", name: time, widget: string, pattern: ['^\d{1,2}:\d{2}(:\d{2})?$', 'Format mm:ss ou h:mm:ss']}
          - {label: Intertitre, name: heading, widget: string, required: false}
          - {label: Texte, name: text, widget: text}
      - {label: Brouillon (non visible sur le site), name: draft, widget: boolean, default: true}
      - {label: Texte, name: body, widget: markdown}
  - name: events
    label: Événements
    label_singular: Événement
    folder: content/events
    create: true
    slug: '{{slug}}'
    preview_path: 'evenements/{{slug}}/'
    fields:
      - {label: Titre, name: title, widget: string}
      - {label: Adresse URL, name: slug, widget: string, pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Minuscules, chiffres et tirets uniquement']}
      - {label: Date et heure (fuseau inclus), name: date, widget: datetime, format: YYYY-MM-DDTHH:mm:ssZ}
      - {label: Lieu, name: location, widget: string, required: false}
      - {label: Catégorie, name: category, widget: select, options: [Conférence, Audience, Commission de travail], default: Conférence}
      - {label: Résumé, name: description, widget: text, required: false}
      - {label: Image, name: image, widget: image, required: false}
      - {label: Document PDF, name: pdf, widget: file, required: false}
      - {label: Lien d’inscription HTTPS, name: registrationUrl, widget: string, required: false}
      - {label: Brouillon (non visible sur le site), name: draft, widget: boolean, default: true}
      - {label: Description complète, name: body, widget: markdown}
  - name: settings
    label: Pages du site
    files:
      - name: home
        label: Accueil
        file: content/settings/home.yml
        fields:
          - {label: Titre principal, name: title, widget: string}
          - {label: Titre de présentation, name: introTitle, widget: string}
          - {label: Texte de présentation, name: introBody, widget: markdown}
