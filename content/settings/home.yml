title: Institut La Raison
introTitle: L'Institut
introBody: >-
  L’Institut La Raison est un laboratoire d’idées, sous la forme d’une
  association de loi 1901, apolitique et indépendant, fondé sur l’objectivité et
  le dialogue  

  Sa vocation est de contribuer, en toute autonomie, à la structuration du débat
  public en défendant la rigueur, la méthode et la clarté. L’institut existe, en
  ce sens, pour ouvrir des perspectives, nourrir le débat et éclairer l’action
  publique.   

  Il s’érige en contrepoint aux discours confus qui embrouillent le débat, à la
  prééminence de l’émotion au détriment des faits et de l’analyse, ainsi qu’aux
  grilles de lecture partisanes.
